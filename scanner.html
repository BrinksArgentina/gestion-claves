<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BRINKS KEYS — Escáner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .logo{color:#4f8ef7;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;font-family:'Courier New',monospace;}
  .title{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center;}
  .sub{color:#666;font-size:13px;margin-bottom:24px;text-align:center;}

  /* SCANNER */
  .scanner-wrap{position:relative;width:100%;max-width:320px;}
  #scanner-video{width:100%;border-radius:14px;display:block;background:#111;}
  .scanner-frame{position:absolute;inset:0;border-radius:14px;pointer-events:none;}
  .corner{position:absolute;width:30px;height:30px;border-color:#4f8ef7;border-style:solid;}
  .corner.tl{top:10px;left:10px;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
  .corner.tr{top:10px;right:10px;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
  .corner.bl{bottom:10px;left:10px;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
  .corner.br{bottom:10px;right:10px;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
  .scan-line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#4f8ef7,transparent);animation:scanline 2s linear infinite;}
  @keyframes scanline{0%{top:12%}100%{top:88%}}

  .status{color:#888;font-size:13px;margin-top:14px;text-align:center;min-height:20px;}
  .btn-start{background:linear-gradient(135deg,#1a6ef7,#3b9eff);color:#fff;border:none;border-radius:14px;padding:14px 40px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;box-shadow:0 6px 20px rgba(59,158,255,.4);margin-top:20px;}
  .btn-cancel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#aaa;border-radius:10px;padding:10px 28px;font-size:14px;cursor:pointer;margin-top:14px;}

  /* LEGAJO */
  .legajo-screen{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:320px;}
  .legajo-title{font-size:18px;font-weight:700;text-align:center;}
  .legajo-caja{color:#4f8ef7;font-family:'Courier New',monospace;font-size:14px;text-align:center;}
  .legajo-input{width:100%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:14px;color:#fff;font-size:22px;text-align:center;letter-spacing:4px;outline:none;font-family:'Courier New',monospace;}
  .legajo-input:focus{border-color:#4f8ef7;}
  .legajo-btn{width:100%;background:linear-gradient(135deg,#1a6ef7,#3b9eff);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:1px;}
  .legajo-loading{font-size:13px;color:#666;min-height:18px;text-align:center;}
  .btn-volver{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#666;border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;}

  /* RESULTADO */
  .resultado-screen{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:340px;text-align:center;}
  .alarma-code{font-family:'Courier New',monospace;font-size:clamp(52px,16vw,100px);font-weight:900;letter-spacing:4px;line-height:1;color:#fff;word-break:break-all;}
  .sin-alarma{font-family:'Courier New',monospace;font-size:clamp(26px,9vw,50px);font-weight:900;color:#f75f5f;}
  .res-cliente{color:#888;font-size:16px;}
  .res-novedad{background:#1a1a00;border:1px solid #444400;border-radius:10px;padding:14px 18px;max-width:320px;width:100%;}
  .res-novedad-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#f7a24f;margin-bottom:6px;}
  .res-novedad-text{color:#fff;font-size:15px;line-height:1.4;}
  .res-jefe{color:#555;font-size:12px;margin-top:8px;}
  .dot{width:8px;height:8px;background:#4f8ef7;border-radius:50%;margin:24px auto 0;}
  .denied-code{font-size:clamp(28px,10vw,52px);font-weight:900;color:#f75f5f;font-family:'Courier New',monospace;}
  .denied-msg{color:#666;font-size:14px;max-width:280px;}
</style>
</head>
<body>

<div class="logo">🔐 BRINKS KEYS</div>

<!-- PANTALLA INICIO -->
<div id="screen-inicio">
  <div class="title">Escáner de QR</div>
  <div class="sub">Jefes de Equipo</div>
  <div class="scanner-wrap" id="scanner-wrap" style="display:none">
    <video id="scanner-video" autoplay playsinline muted></video>
    <div class="scanner-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>
    </div>
  </div>
  <div class="status" id="scanner-status">Presioná el botón para escanear</div>
  <button class="btn-start" id="btn-start" onclick="startScanner()">📷 Escanear QR</button>
  <button class="btn-cancel" id="btn-cancel" style="display:none" onclick="stopScanner()">✕ Cancelar</button>
</div>

<!-- PANTALLA LEGAJO -->
<div id="screen-legajo" style="display:none">
  <div class="legajo-screen">
    <div class="legajo-title">Ingresá tu legajo</div>
    <div class="legajo-caja" id="legajo-caja-id"></div>
    <input class="legajo-input" type="number" id="legajo-input" placeholder="000000000" autofocus>
    <button class="legajo-btn" onclick="validar()">Validar ›</button>
    <div class="legajo-loading" id="legajo-status"></div>
    <button class="btn-volver" onclick="volverInicio()">← Volver</button>
  </div>
</div>

<!-- PANTALLA RESULTADO -->
<div id="screen-resultado" style="display:none">
  <div class="resultado-screen" id="resultado-content"></div>
  <div class="dot"></div>
  <button class="btn-volver" style="margin-top:24px" onclick="volverInicio()">← Escanear otra caja</button>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyiKB7k3EGA-_VQI5h4J2n9VduMsQk873EXEVsKYis0mDp_xPh62xofaMyGOCrcSf2K/exec';
const TOKEN = 'clavesbrinks.2026';

let scannerStream = null;
let scannerInterval = null;
let currentScanId = null;

function show(id) {
  ['screen-inicio','screen-legajo','screen-resultado'].forEach(s => {
    document.getElementById(s).style.display = s===id ? 'flex' : 'none';
    document.getElementById(s).style.flexDirection = 'column';
    document.getElementById(s).style.alignItems = 'center';
  });
}

// ─── SCANNER ─────────────────────────────────────────────────────────────────
async function startScanner() {
  document.getElementById('scanner-wrap').style.display = 'block';
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-cancel').style.display = 'block';
  document.getElementById('scanner-status').textContent = 'Iniciando cámara…';
  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    const video = document.getElementById('scanner-video');
    video.srcObject = scannerStream;
    await video.play();
    document.getElementById('scanner-status').textContent = 'Apuntá al código QR…';
    startScanLoop(video);
  } catch(err) {
    document.getElementById('scanner-status').textContent = 'Error al acceder a la cámara';
  }
}

function startScanLoop(video) {
  if ('BarcodeDetector' in window) {
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    scannerInterval = setInterval(async () => {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        try {
          const codes = await detector.detect(video);
          if (codes.length > 0) { stopScanner(); handleQR(codes[0].rawValue); }
        } catch(e) {}
      }
    }, 300);
  } else {
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js').then(() => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      scannerInterval = setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(img.data, img.width, img.height);
          if (code) { stopScanner(); handleQR(code.data); }
        }
      }, 300);
    });
  }
}

function stopScanner() {
  if (scannerInterval) { clearInterval(scannerInterval); scannerInterval = null; }
  if (scannerStream) { scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
  document.getElementById('scanner-wrap').style.display = 'none';
  document.getElementById('btn-start').style.display = 'block';
  document.getElementById('btn-cancel').style.display = 'none';
  document.getElementById('scanner-status').textContent = 'Presioná el botón para escanear';
}

function handleQR(raw) {
  let scanId = raw;
  try { const u = new URL(raw); scanId = u.searchParams.get('scan') || raw; } catch(e) {}
  currentScanId = decodeURIComponent(scanId).trim();
  document.getElementById('legajo-caja-id').textContent = 'Caja: ' + currentScanId;
  document.getElementById('legajo-input').value = '';
  document.getElementById('legajo-status').textContent = '';
  show('screen-legajo');
  setTimeout(() => document.getElementById('legajo-input').focus(), 100);
}

// ─── VALIDAR ─────────────────────────────────────────────────────────────────
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    window[cb] = (d) => { delete window[cb]; document.getElementById(cb)?.remove(); resolve(d); };
    const s = document.createElement('script');
    s.id = cb; s.onerror = () => reject(new Error('Error'));
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}

async function validar() {
  const legajo = document.getElementById('legajo-input').value.trim();
  if (!legajo) { document.getElementById('legajo-status').textContent = 'Ingresá tu legajo'; return; }
  document.getElementById('legajo-status').textContent = 'Validando…';
  try {
    const payload = encodeURIComponent(JSON.stringify({action:'validar', parid:currentScanId, legajo}));
    const res = await jsonp(SHEET_URL + '?token='+TOKEN+'&action=validar&payload='+payload);

    if (!res.ok || !res.autorizado) {
      show('screen-resultado');
      document.getElementById('resultado-content').innerHTML = `
        <div class="denied-code">ACCESO DENEGADO</div>
        <div class="denied-msg">Legajo no autorizado para esta caja hoy.</div>
        <div style="color:#333;font-size:12px;margin-top:8px">Caja: ${currentScanId}</div>
      `;
      return;
    }

    const caja = res.caja || {};
    const alarmaHtml = caja.alarma
      ? `<div style="color:#555;font-size:11px;letter-spacing:2px;text-transform:uppercase">CÓDIGO DE ALARMA</div><div class="alarma-code">${caja.alarma}</div>`
      : `<div style="color:#555;font-size:11px;letter-spacing:2px;text-transform:uppercase">ALARMA</div><div class="sin-alarma">SIN ALARMA</div>`;
    const novedadHtml = caja.novedad
      ? `<div class="res-novedad"><div class="res-novedad-label">⚠ Novedad</div><div class="res-novedad-text">${caja.novedad}</div></div>`
      : '';

    show('screen-resultado');
    document.getElementById('resultado-content').innerHTML = `
      ${alarmaHtml}
      <div class="res-cliente">${caja.cliente||currentScanId}</div>
      ${novedadHtml}
      ${res.jefe ? `<div class="res-jefe">👤 ${res.jefe}</div>` : ''}
    `;
  } catch(e) {
    document.getElementById('legajo-status').textContent = 'Error de conexión. Reintentá.';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('screen-legajo').style.display !== 'none') validar();
});

function volverInicio() {
  show('screen-inicio');
  document.getElementById('screen-inicio').style.display = 'flex';
}

function loadScript(src) {
  return new Promise((res,rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

// Check if came from QR scan directly
window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const scan = params.get('scan');
  if (scan) handleQR(scan);
  else show('screen-inicio');
};
</script>
</body>
</html>
